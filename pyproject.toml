[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homeops"
version = "0.1.0"
description = "Local home-automation event bus"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "sse-starlette",
    "httpx",
]

[project.optional-dependencies]
# MCP server (homeops-mcp). Install in the main environment (.venv).
server = [
    "fastmcp",
]
# Strands agent + brain. Install in a SEPARATE environment (venv-agent):
# strands-agents needs mcp<2.2 while fastmcp needs mcp 2.x.
agent = [
    "strands-agents[gemini]",
    "python-dotenv",
]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
homeops = "homeops.cli:main"
homeops-mcp = "homeops.mcp_server:main"
homeops-agent = "homeops.agent:__main__"
homeops-brain = "homeops.brain:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homeops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]