[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homeops"
version = "0.1.0"
description = "Local home-automation event bus"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "sse-starlette",
    "httpx",
    "fastmcp",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "python-dotenv",
    "strands-agents",
]

[project.scripts]
homeops-agent = "homeops.agent:__main__"
homeops-mcp = "homeops.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homeops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
